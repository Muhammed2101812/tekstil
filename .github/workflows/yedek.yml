name: Supabase Otomatik Yedekleme

on:
  schedule:
    # Her Pazartesi saat 03:00 UTC (TSİ 06:00)
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Manuel yedek tetikleme nedeni'
        required: false
        default: 'Manuel tetiklendi'

concurrency:
  group: supabase-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Supabase Veritabanı Dökümü ve Arşivleme
    runs-on: ubuntu-latest
    steps:
      - name: Kod Deposunu İndir
        uses: actions/checkout@v4

      - name: Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Bağımlılıkları Yükle
        run: npm ci

      - name: PostgreSQL Client Araçlarını Doğrula
        run: |
          which pg_dump pg_dumpall psql
          pg_dump --version

      - name: Supabase Veritabanı Dökümünü Al
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL secret'ı tanımlı değil. Lütfen GitHub Secrets üzerinden ayarlayın."
            exit 1
          fi

          mkdir -p tmp_dump
          TIMESTAMP=$(date -u +'%Y-%m-%d-%H%M')
          DUMP_FILENAME="dump-${TIMESTAMP}.sql"

          echo "Roles dökümü alınıyor..."
          npx supabase db dump --db-url "$SUPABASE_DB_URL" --role-only -f tmp_dump/roles.sql || touch tmp_dump/roles.sql

          echo "Schema dökümü (public, auth) alınıyor..."
          npx supabase db dump --db-url "$SUPABASE_DB_URL" -s "public,auth" -f tmp_dump/schema.sql

          echo "Data dökümü (tüm tablolar) alınıyor..."
          npx supabase db dump --db-url "$SUPABASE_DB_URL" --data-only --use-copy -f tmp_dump/data.sql

          mkdir -p output
          {
            echo "-- ============================================================================"
            echo "-- Atölye Defteri Supabase Veritabanı Dökümü"
            echo "-- Tarih (UTC): $(date -u +'%Y-%m-%d %H:%M:%S')"
            echo "-- ============================================================================"
            echo ""
            cat tmp_dump/roles.sql
            echo ""
            cat tmp_dump/schema.sql
            echo ""
            cat tmp_dump/data.sql
          } > "output/${DUMP_FILENAME}"

          echo "Döküm başarıyla oluşturuldu: output/${DUMP_FILENAME}"
          ls -lh "output/${DUMP_FILENAME}"

      - name: Yedek Deposunu Klonla ve Arşivle
        env:
          BACKUP_REPO_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
        run: |
          if [ -z "$BACKUP_REPO_TOKEN" ]; then
            echo "::error::BACKUP_REPO_TOKEN secret'ı tanımlı değil. Lütfen yedek deposuna yazma yetkisi olan bir PAT (Personal Access Token) tanımlayın."
            exit 1
          fi

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git clone "https://x-access-token:${BACKUP_REPO_TOKEN}@github.com/Muhammed2101812/tekstil-yedekler.git" backup_repo
          cd backup_repo

          mkdir -p yedekler
          cp ../output/dump-*.sql yedekler/

          echo "Eski yedekler temizleniyor (Son 12 döküm saklanır)..."
          cd yedekler
          # Son 12 dökümden eskileri sil
          ls -tp dump-*.sql 2>/dev/null | grep -v '/$' | tail -n +13 | xargs -I {} rm -f -- {} || true
          cd ..

          git add yedekler/
          if git diff --staged --quiet; then
            echo "Yedek deposunda değişiklik yok."
          else
            TIMESTAMP=$(date -u +'%Y-%m-%d %H:%M UTC')
            git commit -m "chore(backup): otomatik veritabani dokumu - ${TIMESTAMP}"
            git push origin main
            echo "Yedek deposuna başarıyla push edildi."
          fi
