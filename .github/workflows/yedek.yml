name: Supabase Otomatik Yedekleme

on:
  schedule:
    # Her gün 03:00 UTC (TSİ 06:00)
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Manuel yedek tetikleme nedeni'
        required: false
        default: 'Manuel tetiklendi'

concurrency:
  group: supabase-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Supabase Dökümü, Şifreleme ve Arşivleme
    runs-on: ubuntu-latest
    steps:
      - name: Kod Deposunu İndir
        uses: actions/checkout@v4

      - name: Node.js Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Bağımlılıkları Yükle
        run: npm ci

      - name: PostgreSQL Client ve GPG Araçlarını Doğrula
        run: |
          which pg_dump pg_dumpall psql gpg
          pg_dump --version
          gpg --version | head -n 1

      - name: Supabase Veritabanı Dökümünü Al
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL secret'ı tanımlı değil. Lütfen GitHub Secrets üzerinden ayarlayın."
            exit 1
          fi

          mkdir -p tmp_dump output
          TIMESTAMP=$(date -u +'%Y-%m-%d-%H%M')
          DUMP_FILENAME="dump-${TIMESTAMP}.sql"

          echo "Roles dökümü alınıyor..."
          npx supabase db dump --db-url "$SUPABASE_DB_URL" --role-only -f tmp_dump/roles.sql || touch tmp_dump/roles.sql

          echo "Schema dökümü (public, auth) alınıyor..."
          npx supabase db dump --db-url "$SUPABASE_DB_URL" -s "public,auth" -f tmp_dump/schema.sql

          echo "Data dökümü (tüm tablolar) alınıyor..."
          npx supabase db dump --db-url "$SUPABASE_DB_URL" --data-only --use-copy -f tmp_dump/data.sql

          {
            echo "-- ============================================================================"
            echo "-- Atölye Defteri Supabase Veritabanı Dökümü"
            echo "-- Tarih (UTC): $(date -u +'%Y-%m-%d %H:%M:%S')"
            echo "-- ============================================================================"
            echo ""
            cat tmp_dump/roles.sql
            echo ""
            cat tmp_dump/schema.sql
            echo ""
            cat tmp_dump/data.sql
          } > "output/${DUMP_FILENAME}"

          echo "Döküm başarıyla oluşturuldu: output/${DUMP_FILENAME}"
          ls -lh "output/${DUMP_FILENAME}"

          echo "DUMP_FILENAME=${DUMP_FILENAME}" >> "$GITHUB_ENV"

      - name: Dökümü GPG ile Şifrele (AES256)
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::BACKUP_PASSPHRASE secret'ı tanımlı değil. Yedekler şifrelenmeden commit edilemez."
            exit 1
          fi

          # Şifre komut satırında görünmez: passphrase stdin üzerinden verilir (agent.md:
          # düz SQL asla yedek deposuna commit edilmez)
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 \
            -o "output/${DUMP_FILENAME}.gpg" "output/${DUMP_FILENAME}"

          # Düz SQL dosyasını hemen sil
          rm -f "output/${DUMP_FILENAME}"
          shred -u tmp_dump/*.sql 2>/dev/null || rm -f tmp_dump/*.sql

          echo "Şifreli döküm oluşturuldu: output/${DUMP_FILENAME}.gpg"
          ls -lh "output/${DUMP_FILENAME}.gpg"

      - name: Yedek Deposuna Push Et (Tek Commit Geçmişi)
        env:
          BACKUP_REPO_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
        run: |
          if [ -z "$BACKUP_REPO_TOKEN" ]; then
            echo "::error::BACKUP_REPO_TOKEN secret'ı tanımlı değil. Lütfen yedek deposuna yazma yetkisi olan bir PAT tanımlayın."
            exit 1
          fi

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git clone "https://x-access-token:${BACKUP_REPO_TOKEN}@github.com/Muhammed2101812/tekstil-yedekler.git" backup_repo
          cd backup_repo

          mkdir -p yedekler
          cp "../output/${DUMP_FILENAME}.gpg" yedekler/

          echo "Eski yedekler temizleniyor (son 14 şifreli döküm saklanır)..."
          cd yedekler
          ls -tp dump-*.sql.gpg 2>/dev/null | grep -v '/$' | tail -n +15 | xargs -I {} rm -f -- {} || true
          cd ..

          # Git geçmişinin her gün şişmemesi için orphan dal ile tek commit olarak tut
          # (agent.md / VERI_GUVENLIGI_PLANI.md Faz 5)
          git checkout --orphan temp-backup
          git add yedekler/
          TIMESTAMP=$(date -u +'%Y-%m-%d %H:%M UTC')
          git commit -m "chore(backup): sifreli gunluk dokum - ${TIMESTAMP}"
          git branch -D main
          git branch -m main
          git push --force origin main
          echo "Yedek deposuna tek commit olarak push edildi."
